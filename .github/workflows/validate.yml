name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: |
          if test -f package-lock.json; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Capture initial dependency lock
        if: hashFiles('package-lock.json') != ''
        run: |
          if ! git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            node -e "const s=require('fs').readFileSync('package-lock.json','utf8'); for(let i=0;i<s.length;i+=1000) console.log('LOCKFILE '+JSON.stringify(s.slice(i,i+1000)));"
          fi
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Validate generated pages
        run: node --test test/build.test.mjs
