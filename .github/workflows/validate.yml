name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    name: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Resolve updated dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit
      - name: Capture resolved lock
        run: node -e "const s=require('fs').readFileSync('package-lock.json','utf8'); for(let i=0;i<s.length;i+=1000) console.log('LOCKFILE '+JSON.stringify(s.slice(i,i+1000)));"
      - run: npm ci --no-audit
      - name: Dependency safety
        run: npm audit --audit-level=high --json > /tmp/dependency-review.json
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Validate generated pages
        run: node --test test/build.test.mjs
